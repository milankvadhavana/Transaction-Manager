<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        /* General body styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Container styling */
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        /* Heading styling */
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        /* Input field styling */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }

        /* Button styling */
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        /* Error message styling */
        .error {
            color: #ff0000;
            font-size: 14px;
            margin-bottom: 10px;
            display: none; /* Hidden by default */
        }
    </style>
    <script>
        // Function to display error message from URL query parameters
        function showErrorMessage() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            if (error) {
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = error;
                errorDiv.style.display = 'block'; // Show the error message
            }
        }

        // Function to validate the form before submission
        function validateForm() {
            const mobile = document.getElementById('mobile').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const city = document.getElementById('city').value;
            const state = document.getElementById('state').value;
            const country = document.getElementById('country').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            // Basic validation
            if (mobile.trim() === '' || name.trim() === '' || email.trim() === '' || city.trim() === '' || state.trim() === '' || country.trim() === '' || password.trim() === '') {
                errorDiv.textContent = 'Please fill in all fields.';
                errorDiv.style.display = 'block';
                return false; // Prevent form submission
            }

            // Mobile number validation
            if (mobile.length !== 10 || isNaN(mobile)) {
                errorDiv.textContent = 'Please enter a valid 10-digit mobile number.';
                errorDiv.style.display = 'block';
                return false; // Prevent form submission
            }

            // Email validation (basic)
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                errorDiv.textContent = 'Please enter a valid email address.';
                errorDiv.style.display = 'block';
                return false; // Prevent form submission
            }

            return true; // Allow form submission
        }

        // Call the function to show error messages when the page loads
        window.onload = showErrorMessage;
    </script>
</head>
<body>
    <div class="container">
        <h2>Registration</h2>
        <!-- Error message placeholder -->
        <div class="error" id="errorMessage"></div>
        <form action="RegistrationServlet" method="post" onsubmit="return validateForm()">
            <input type="text" name="mobile" id="mobile" placeholder="Mobile Number" required>
            <input type="text" name="name" id="name" placeholder="Full Name" required>
            <input type="email" name="email" id="email" placeholder="Email" required>
            <input type="text" name="city" id="city" placeholder="City" required>
            <input type="text" name="state" id="state" placeholder="State" required>
            <input type="text" name="country" id="country" placeholder="Country" required>
            <input type="password" name="password" id="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
