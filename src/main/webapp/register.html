<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Manager - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-dark: #3a56d4;
            --secondary-color: #4cc9f0;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4bb543;
            --error-color: #ff3333;
            --border-radius: 12px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .register-container {
            display: flex;
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
        }

        .register-illustration {
            flex: 1;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: white;
            display: none; /* Hidden on mobile */
        }

        .register-illustration img {
            max-width: 100%;
            height: auto;
            margin-bottom: 30px;
        }

        .register-illustration h2 {
            font-size: 24px;
            margin-bottom: 15px;
            text-align: center;
        }

        .register-illustration p {
            text-align: center;
            opacity: 0.9;
            font-weight: 300;
        }

        .register-form {
            flex: 1;
            padding: 60px 40px;
            position: relative;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: var(--primary-color);
            font-size: 28px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
        }

        .logo h1 i {
            margin-right: 10px;
            font-size: 32px;
        }

        .register-form h2 {
            color: var(--dark-color);
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }

        .register-form p.subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 14px;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: var(--error-color);
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .password-strength {
            margin-top: 5px;
            font-size: 12px;
            color: #666;
        }

        .strength-meter {
            height: 5px;
            background: #eee;
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
        }

        .strength-meter-fill {
            height: 100%;
            width: 0;
            background: var(--error-color);
            transition: width 0.3s ease;
        }

        /* Responsive design */
        @media (min-width: 768px) {
            .register-illustration {
                display: flex;
            }
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-form {
            animation: fadeIn 0.6s ease-out;
        }

        /* Two-column layout for larger screens */
        @media (min-width: 992px) {
            .form-row {
                display: flex;
                gap: 20px;
            }
            .form-row .form-group {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-illustration">
            <img src="https://cdn-icons-png.flaticon.com/512/4400/4400628.png" alt="Registration Illustration">
            <h2>Join Us Today!</h2>
            <p>Create your account to start managing your transactions with our secure platform.</p>
        </div>
        <div class="register-form">
            <div class="logo">
                <h1><i class="fas fa-wallet"></i> Transaction Manager</h1>
            </div>
            <h2>Create Account</h2>
            <p class="subtitle">Fill in your details to get started</p>
            
            <div id="errorMessage" class="error-message"></div>
            
            <form action="RegistrationServlet" method="post" onsubmit="return validateForm()">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" name="name" id="name" class="form-control" placeholder="Enter your full name" required>
                        </div>
                        <div id="nameError" class="error-message"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <div class="input-with-icon">
                            <i class="fas fa-mobile-alt"></i>
                            <input type="text" name="mobile" id="mobile" class="form-control" placeholder="Enter 10-digit number" required>
                        </div>
                        <div id="mobileError" class="error-message"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                    <div id="emailError" class="error-message"></div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City</label>
                        <div class="input-with-icon">
                            <i class="fas fa-city"></i>
                            <input type="text" name="city" id="city" class="form-control" placeholder="Enter your city" required>
                        </div>
                        <div id="cityError" class="error-message"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="state">State</label>
                        <div class="input-with-icon">
                            <i class="fas fa-map-marker-alt"></i>
                            <input type="text" name="state" id="state" class="form-control" placeholder="Enter your state" required>
                        </div>
                        <div id="stateError" class="error-message"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="country">Country</label>
                    <div class="input-with-icon">
                        <i class="fas fa-globe"></i>
                        <input type="text" name="country" id="country" class="form-control" placeholder="Enter your country" required>
                    </div>
                    <div id="countryError" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Create a password" required>
                        <i class="fas fa-eye" id="togglePassword" style="left: auto; right: 15px; cursor: pointer;"></i>
                    </div>
                    <div class="password-strength">
                        <div id="strengthText">Password strength: <span id="strengthValue">Weak</span></div>
                        <div class="strength-meter">
                            <div class="strength-meter-fill" id="strengthMeter"></div>
                        </div>
                    </div>
                    <div id="passwordError" class="error-message"></div>
                </div>
                
                <button type="submit" class="btn">Create Account</button>
            </form>
            
            <div class="login-link">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        // Enhanced form validation
        function validateForm() {
            const name = document.getElementById('name').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const email = document.getElementById('email').value.trim();
            const city = document.getElementById('city').value.trim();
            const state = document.getElementById('state').value.trim();
            const country = document.getElementById('country').value.trim();
            const password = document.getElementById('password').value.trim();
            
            // Reset error messages
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
            });
            
            let isValid = true;
            
            // Name validation
            if (name === '') {
                document.getElementById('nameError').textContent = 'Full name is required';
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            } else if (name.length < 3) {
                document.getElementById('nameError').textContent = 'Name must be at least 3 characters';
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            }
            
            // Mobile validation
            if (mobile === '') {
                document.getElementById('mobileError').textContent = 'Mobile number is required';
                document.getElementById('mobileError').style.display = 'block';
                isValid = false;
            } else if (!/^\d{10}$/.test(mobile)) {
                document.getElementById('mobileError').textContent = 'Please enter a valid 10-digit mobile number';
                document.getElementById('mobileError').style.display = 'block';
                isValid = false;
            }
            
            // Email validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email === '') {
                document.getElementById('emailError').textContent = 'Email is required';
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            } else if (!emailPattern.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email address';
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }
            
            // Location validation
            if (city === '') {
                document.getElementById('cityError').textContent = 'City is required';
                document.getElementById('cityError').style.display = 'block';
                isValid = false;
            }
            
            if (state === '') {
                document.getElementById('stateError').textContent = 'State is required';
                document.getElementById('stateError').style.display = 'block';
                isValid = false;
            }
            
            if (country === '') {
                document.getElementById('countryError').textContent = 'Country is required';
                document.getElementById('countryError').style.display = 'block';
                isValid = false;
            }
            
            // Password validation
            if (password === '') {
                document.getElementById('passwordError').textContent = 'Password is required';
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            } else if (password.length < 8) {
                document.getElementById('passwordError').textContent = 'Password must be at least 8 characters';
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            }
            
            // Check for URL error parameters
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            
            if (error) {
                document.getElementById('errorMessage').textContent = error;
                document.getElementById('errorMessage').style.display = 'block';
            }
            
            return isValid;
        }
        
        // Password strength checker
        function checkPasswordStrength(password) {
            let strength = 0;
            const strengthMeter = document.getElementById('strengthMeter');
            const strengthValue = document.getElementById('strengthValue');
            
            if (password.length >= 8) strength += 1;
            if (password.match(/[a-z]/)) strength += 1;
            if (password.match(/[A-Z]/)) strength += 1;
            if (password.match(/[0-9]/)) strength += 1;
            if (password.match(/[^a-zA-Z0-9]/)) strength += 1;
            
            let width = 0;
            let color = '';
            let text = '';
            
            switch(strength) {
                case 0:
                case 1:
                    width = 20;
                    color = '#ff3333';
                    text = 'Weak';
                    break;
                case 2:
                    width = 40;
                    color = '#ff9933';
                    text = 'Fair';
                    break;
                case 3:
                    width = 60;
                    color = '#ffcc00';
                    text = 'Good';
                    break;
                case 4:
                    width = 80;
                    color = '#99cc33';
                    text = 'Strong';
                    break;
                case 5:
                    width = 100;
                    color = '#4bb543';
                    text = 'Very Strong';
                    break;
            }
            
            strengthMeter.style.width = width + '%';
            strengthMeter.style.backgroundColor = color;
            strengthValue.textContent = text;
            strengthValue.style.color = color;
        }
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Password toggle
            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');
            
            togglePassword.addEventListener('click', function() {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
            
            // Password strength checker
            password.addEventListener('input', function() {
                checkPasswordStrength(this.value);
            });
            
            // Check for URL errors on page load
            validateForm();
        });
    </script>
</body>
</html>
