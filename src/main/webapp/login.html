<!DOCTYPE html>
<html>
<head>
    <title>Transaction Manager - Login</title>
    <style>
        /* General body styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Container styling */
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        /* Heading styling */
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        /* Input field styling */
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }

        /* Button styling */
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        /* Register link styling */
        .register {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .register a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* Error message styling */
        .error {
            color: #ff0000;
            font-size: 14px;
            margin-bottom: 10px;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <!-- Error message placeholder -->
        <div class="error" id="errorMessage"></div>
        <form action="LoginServlet" method="post" onsubmit="return validateForm()">
            <input type="text" name="mobile" id="mobile" placeholder="Mobile Number" required>
            <input type="password" name="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div class="register">
            <a href="register.html">New User? Register Here</a>
        </div>
    </div>

    <script>
        // Function to display error message from URL query parameters
        function showErrorMessage() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            if (error) {
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = error;
                errorDiv.style.display = 'block'; // Show the error message
            }
        }

        // Function to validate the form before submission
        function validateForm() {
            const mobile = document.getElementById('mobile').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            // Basic validation
            if (mobile.trim() === '' || password.trim() === '') {
                errorDiv.textContent = 'Please fill in all fields.';
                errorDiv.style.display = 'block';
                return false; // Prevent form submission
            }

            // Additional validation (e.g., mobile number length)
            if (mobile.length !== 10 || isNaN(mobile)) {
                errorDiv.textContent = 'Please enter a valid 10-digit mobile number.';
                errorDiv.style.display = 'block';
                return false; // Prevent form submission
            }

            return true; // Allow form submission
        }

        // Call the function to show error messages when the page loads
        window.onload = showErrorMessage;
    </script>
</body>
</html>
